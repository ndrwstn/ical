name: Update UFC calendar

on:
  push:
    branches: [master]
    paths:
      - "src/ufc.mjs"
      - "scripts/generate.mjs"
      - ".github/workflows/update-ufc.yml"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy-ufc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve published calendars
        run: |
          mkdir -p public
          curl --fail --location --retry 3 https://ndrwstn.github.io/ical/icc-test-cricket.ics -o public/icc-test-cricket.ics || true
          curl --fail --location --retry 3 https://ndrwstn.github.io/ical/aflw-cats.ics -o public/aflw-cats.ics || true
      - name: Generate UFC feed
        run: npm run generate:ufc
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
