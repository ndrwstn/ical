name: Update ICC Test Cricket calendar

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy-icc-test-cricket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve published UFC feed
        run: |
          mkdir -p public
          curl --fail --location --retry 3 https://ndrwstn.github.io/ical/ufc.ics -o public/ufc.ics
      - name: Generate ICC Test Cricket feed
        run: npm run generate:icc-test-cricket
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      - name: Report CricketData usage
        if: always()
        run: |
          node -e 'const fs=require("fs"); const p="state/cricketdata-usage.json"; if (fs.existsSync(p)) { const u=JSON.parse(fs.readFileSync(p)); console.log(`CricketData API calls this run: ${u.runCalls}; aggregate today: ${u.total}/90.`); } else { console.log("CricketData API calls this run: 0; aggregate today: 0/90."); }'
      - name: Save ICC Test Cricket feed and usage
        if: always()
        run: |
          if test -z "$(git status --porcelain -- public/icc-test-cricket.ics state/cricketdata-usage.json)"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/icc-test-cricket.ics state/cricketdata-usage.json
          git commit -m "Update ICC Test Cricket calendar and API usage"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
