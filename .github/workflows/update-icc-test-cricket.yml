name: Diagnose ICC Test Cricket source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-icc-test-cricket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect CricketData series catalogue
        run: npm run diagnose:icc-test-cricket
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
