name: Update ICC Test Cricket calendar

on:
  push:
    branches: [master]
    paths:
      - "src/icc-test-cricket.mjs"
      - "scripts/generate-icc-test-cricket.mjs"
      - ".github/workflows/update-icc-test-cricket.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-icc-test-cricket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve published calendars
        run: |
          mkdir -p public
          curl --fail --location --retry 3 https://ndrwstn.github.io/ical/ufc.ics -o public/ufc.ics
          curl --fail --location --retry 3 https://ndrwstn.github.io/ical/aflw-cats.ics -o public/aflw-cats.ics || true
      - name: Generate ICC Test Cricket calendar from official boards
        run: npm run generate:icc-test-cricket
      - name: Save the ICC Test Cricket calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icc-test-cricket.ics
          git diff --cached --quiet || git commit -m "Update ICC Test Cricket calendar"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
